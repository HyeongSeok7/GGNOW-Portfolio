<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/main.css?v=3.0">
<link rel="stylesheet" href="/assets/css/mypage.css">

    <title>비밀번호 변경</title>
</head>
<body class="event-page">
<aside class="sidebar">
    <div class="logo">
        <a href="/main"><img src="/images/logo.jpg" alt="경기도 로고"></a>
    </div>
    <div class="profile">
        <div class="mypage-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
            </svg>
        </div>
        <a href="/mypage"><span>마이페이지</span></a>
    </div>
    <nav class="sidebar-nav">
        <a href="/main">메인페이지</a>
        <a href="/performance">공연행사</a>
        <a href="/education">교육행사</a>
        <a href="/culture">문화행사</a>
        <a href="/exhibition">전시행사</a>
    </nav>
    <div class="footer">
        <img src="/images/banner.png" alt="변화의 중심, 기회의 경기">
    </div>
</aside>

<main class="main-content event-shell">
	<header class="top-nav home-top-nav">
    <nav>
        <a href="/main">메인페이지</a>
        <a href="/performance">공연행사</a>
        <a href="/education">교육행사</a>
        <a href="/culture">문화행사</a>
        <a href="/exhibition">전시행사</a>
        <a href="/customer">고객센터</a>
    </nav>
    <div class="auth" id="authSection">
        <a href="/login"><span>로그인 / 회원가입</span></a>
    </div>
</header>
    <section class="page-hero compact">
        <div>
            <p class="hero-badge">SECURITY</p>
            <h1>비밀번호 변경</h1>
            <p class="hero-desc">안전한 계정 관리를 위해 새로운 비밀번호로 변경해주세요.</p>
        </div>
        <div class="hero-actions">
            <a href="/mypage" class="hero-action-btn secondary">마이페이지로</a>
            <a href="/my-reviews" class="hero-action-btn secondary">내 리뷰 보기</a>
        </div>
    </section>

    <section class="single-column-layout">
        <div class="form-card card-surface">
            <div class="section-head left">
                <div>
                    <p class="section-kicker">PASSWORD</p>
                    <h2>계정 비밀번호 재설정</h2>
                </div>
            </div>

            <div class="password-guide">
                <p>비밀번호는 <strong>6~12자</strong>이며 <strong>영문 + 숫자</strong>를 각각 1개 이상 포함해야 합니다.</p>
            </div>

            <div th:if="${error}" class="feedback-message error" th:text="${error}"></div>
            <div th:if="${success}" class="feedback-message success" th:text="${success}"></div>
            <div th:if="${passwordRuleError}" class="feedback-message error" th:text="${passwordRuleError}"></div>

            <form th:action="@{/change-password}" method="post" th:object="${changePasswordRequest}" class="mypage-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="currentPassword">현재 비밀번호</label>
                    <input type="password" id="currentPassword" th:field="*{currentPassword}" placeholder="현재 비밀번호를 입력하세요">
                </div>

                <div class="form-group">
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" placeholder="새 비밀번호를 입력하세요">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="새 비밀번호를 다시 입력하세요">
                </div>

                <button type="submit" class="primary-submit-btn">변경하기</button>
            </form>
        </div>
    </section>
</main>
<script src="/assets/js/base.js"></script>
</body>
</html>
